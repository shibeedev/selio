# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
# Values on lines ending in "# deployment.<key>" are written by scripts/sync-deployment.mjs
# from contracts/deployments/monad-testnet.json. Do not edit them by hand.
# Before the first monad-testnet deployment they hold placeholders (addresses 0x00…01 to 0x00…04,
# start block 0); "pnpm check" fails while any placeholder remains.
name: selio-indexer
description: Selio exit market, Selio Vault and the Morpho Earn (sim) pool on Monad testnet
schema: ./schema.graphql
address_format: lowercase
rollback_on_reorg: true
field_selection:
  transaction_fields:
    - hash
    - from
contracts:
  - name: SelioMarket
    abi_file_path: ./abis/MorphoVaultExitMarket.json
    events:
      - event: SessionOpened
      - event: UnsoldWithdrawn
      - event: Bought
      - event: BidPlaced
      - event: BidResized
      - event: BidCancelled
      - event: BidFilled
      - event: ReceiptRedeemed
  - name: SelioVault
    abi_file_path: ./abis/SelioVault.json
    events:
      - event: Deposit
      - event: Redeem
      - event: Recovered
      - event: BidsRefreshed
      - event: ReceiptDeferred
      - event: ReceiptClaimed
      - event: Transfer
      - event: SourceDeposited
      - event: SourceWithdrawn
      - event: SourcePulled
      - event: SourceSharesInKind
  - name: EarnVault
    events:
      - event: "Deposit(address indexed sender, address indexed onBehalf, uint256 assets, uint256 shares)"
      - event: "Withdraw(address indexed sender, address indexed receiver, address indexed onBehalf, uint256 assets, uint256 shares)"
      - event: "Allocate(address indexed sender, address indexed adapter, uint256 assets, bytes32[] ids, int256 change)"
      - event: "Deallocate(address indexed sender, address indexed adapter, uint256 assets, bytes32[] ids, int256 change)"
      - event: "ForceDeallocate(address indexed sender, address adapter, uint256 assets, address indexed onBehalf, bytes32[] ids, uint256 penaltyAssets)"
      - event: "AccrueInterest(uint256 previousTotalAssets, uint256 newTotalAssets, uint256 performanceFeeShares, uint256 managementFeeShares)"
      - event: "Transfer(address indexed from, address indexed to, uint256 shares)"
  - name: Morpho
    events:
      - event: "Supply(bytes32 indexed id, address indexed caller, address indexed onBehalf, uint256 assets, uint256 shares)"
      - event: "Withdraw(bytes32 indexed id, address caller, address indexed onBehalf, address indexed receiver, uint256 assets, uint256 shares)"
      - event: "Borrow(bytes32 indexed id, address caller, address indexed onBehalf, address indexed receiver, uint256 assets, uint256 shares)"
      - event: "Repay(bytes32 indexed id, address indexed caller, address indexed onBehalf, uint256 assets, uint256 shares)"
      - event: "SupplyCollateral(bytes32 indexed id, address indexed caller, address indexed onBehalf, uint256 assets)"
      - event: "WithdrawCollateral(bytes32 indexed id, address caller, address indexed onBehalf, address indexed receiver, uint256 assets)"
      - event: "Liquidate(bytes32 indexed id, address indexed caller, address indexed borrower, uint256 repaidAssets, uint256 repaidShares, uint256 seizedAssets, uint256 badDebtAssets, uint256 badDebtShares)"
      - event: "AccrueInterest(bytes32 indexed id, uint256 prevBorrowRate, uint256 interest, uint256 feeShares)"
chains:
  - id: 10143
    start_block: 70734999 # deployment.deployBlock
    rpc:
      - url: https://testnet-rpc.monad.xyz
        for: fallback
        initial_block_interval: 100
        interval_ceiling: 100
    contracts:
      - name: SelioMarket
        address: "0x71541206d91607dde032f7d4a114dfc5a50aa91a" # deployment.market
      - name: SelioVault
        address: "0xde01fbcff7eb15e63f6e259833326097aeb9465f" # deployment.selioVault
      - name: EarnVault
        address: "0x4385eaf60c34989d5ed5df6a5c58881e8c25479f" # deployment.earnVault
      - name: Morpho
        address: "0x66dd7a6dc6e2b68c4c152297af8bb95e02325571" # deployment.morpho
